name: Build & Deploy go-helloworld

on:
  push:
    branches: [main, staging, develop]
    paths:
      - "apps/go-helloworld/**"
      - "charts/go-helloworld/**"
      - ".github/workflows/build-go-helloworld.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: fajarsujai/go-helloworld
  # webserver's public IP, exposed via the nginx stream proxy (iac/ansible/playbooks/install_ingress_proxy.yml) in front of Traefik
  WEBSERVER_PUBLIC_IP: 47.131.191.111

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      floating_tag: ${{ steps.vars.outputs.floating_tag }}
      namespace: ${{ steps.vars.outputs.namespace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute deployment vars
        id: vars
        run: |
          case "$GITHUB_REF_NAME" in
            main) namespace=production; floating_tag=latest ;;
            staging) namespace=staging; floating_tag=staging ;;
            develop) namespace=develop; floating_tag=develop ;;
          esac
          {
            echo "namespace=$namespace"
            echo "floating_tag=$floating_tag"
            echo "image_tag=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/go-helloworld/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.floating_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=go-helloworld
          cache-to: type=gha,mode=max,scope=go-helloworld

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, webserver]
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Helm upgrade
        run: |
          helm upgrade --install go-helloworld charts/go-helloworld \
            --kubeconfig /home/ec2-user/.kube/config \
            --namespace ${{ needs.build-and-push.outputs.namespace }} --create-namespace \
            --set image.repository=${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --set-string secretEnv.JWT_SECRET="${{ secrets.GO_HELLOWORLD_JWT_SECRET }}" \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=go-helloworld-${{ needs.build-and-push.outputs.namespace }}.${{ env.WEBSERVER_PUBLIC_IP }}.nip.io \
            --wait --atomic --timeout 5m
