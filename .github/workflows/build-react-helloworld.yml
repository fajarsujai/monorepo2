name: Build & Push react-helloworld

on:
  push:
    branches: [main]
    paths:
      - "apps/react-helloworld/**"
      - ".github/workflows/build-react-helloworld.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: fajarsujai/react-helloworld

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/react-helloworld/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_BASE_URL=${{ vars.VITE_BASE_URL }}
          cache-from: type=gha,scope=react-helloworld
          cache-to: type=gha,mode=max,scope=react-helloworld
