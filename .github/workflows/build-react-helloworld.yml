name: Build & Deploy react-helloworld

on:
  push:
    branches: [main, staging, develop]
    paths:
      - "apps/react-helloworld/**"
      - "charts/react-helloworld/**"
      - ".github/workflows/build-react-helloworld.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: fajarsujai/react-helloworld
  # webserver's public IP, exposed via the nginx stream proxy (iac/ansible/playbooks/install_ingress_proxy.yml) in front of Traefik
  WEBSERVER_PUBLIC_IP: 47.131.191.111

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      floating_tag: ${{ steps.vars.outputs.floating_tag }}
      namespace: ${{ steps.vars.outputs.namespace }}
      api_url: ${{ steps.vars.outputs.api_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute deployment vars
        id: vars
        run: |
          case "$GITHUB_REF_NAME" in
            main) namespace=production; floating_tag=latest ;;
            staging) namespace=staging; floating_tag=staging ;;
            develop) namespace=develop; floating_tag=develop ;;
          esac
          {
            echo "namespace=$namespace"
            echo "floating_tag=$floating_tag"
            echo "image_tag=$(git rev-parse --short HEAD)"
            echo "api_url=http://go-helloworld-${namespace}.${{ env.WEBSERVER_PUBLIC_IP }}.nip.io"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/react-helloworld/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.floating_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          build-args: |
            VITE_API_URL=${{ steps.vars.outputs.api_url }}
            VITE_BASE_URL=${{ vars.VITE_BASE_URL }}
          cache-from: type=gha,scope=react-helloworld
          cache-to: type=gha,mode=max,scope=react-helloworld

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, webserver]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Helm upgrade
        run: |
          helm upgrade --install react-helloworld charts/react-helloworld \
            --kubeconfig /home/ec2-user/.kube/config \
            --namespace ${{ needs.build-and-push.outputs.namespace }} --create-namespace \
            --set image.repository=${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=react-helloworld-${{ needs.build-and-push.outputs.namespace }}.${{ env.WEBSERVER_PUBLIC_IP }}.nip.io \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix \
            --wait --atomic --timeout 5m
